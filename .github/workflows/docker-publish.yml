name: Build and Push Docker Image

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  IMAGE_NAME: furqatb/express-jwt-auth-csrf
  GITOPS_REPO: FurqatBozorov/gitops-jwt-auth-csrf
  GITOPS_PATH: apps/backend/deployment.yaml   

jobs:
  build-and-publish:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ steps.sha.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops
          persist-credentials: true

      - name: Update image tag in GitOps repo
        run: |
          NEW_TAG="${{ github.ref_name }}-${{ steps.sha.outputs.short_sha }}"
          cd gitops
          sed -i "s|image: ${{ env.IMAGE_NAME }}:.*|image: ${{ env.IMAGE_NAME }}:${NEW_TAG}|" ${{ env.GITOPS_PATH }}
          cat ${{ env.GITOPS_PATH }}

      - name: Commit and push changes
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.GITOPS_PATH }}
          git diff --cached --quiet || git commit -m "ci: update image to ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ steps.sha.outputs.short_sha }}"
          git push

      - name: Job Summary
        run: |
          echo "## Docker Image Published 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ steps.sha.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| New Tag | \`${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ steps.sha.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| GitOps Updated | \`${{ env.GITOPS_PATH }}\` |" >> $GITHUB_STEP_SUMMARY